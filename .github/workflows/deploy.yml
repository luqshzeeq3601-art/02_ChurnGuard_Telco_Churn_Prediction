name: CD Deploy to GCP Cloud Run

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-cloud-run:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        if: env.GCP_SA_KEY != ''
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Google Artifact Registry
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build, Tag, and Push Container Image
        if: env.GCP_SA_KEY != ''
        env:
          IMAGE_URI: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/churnguard-repo/churnguard-api:${{ github.sha }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          docker build -t ${IMAGE_URI} .
          docker push ${IMAGE_URI}

      - name: Deploy to Cloud Run (asia-southeast1)
        if: env.GCP_SA_KEY != ''
        env:
          IMAGE_URI: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/churnguard-repo/churnguard-api:${{ github.sha }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          gcloud run deploy churnguard-api \
            --image ${IMAGE_URI} \
            --platform managed \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --port 8000
